schema_version: 1
module:
  id: bybit
  name: Bybit
  category: crypto
  policy_class: sensitive_account
  status: validating
  owners: [HCloudLab]
  description: Bybit first-party routing module with recorded Clash Verge runtime routing evidence. Authentication-flow validation remains outside the RC gate.
release_policy:
  minimum_evidence: verified
  allowed_ownership: [first_party, dedicated_third_party]
  required_tests: [web_access, auth_flow]
  forbid_unresolved_policy_conflicts: true
rules:
  - id: bybit.domain-suffix.bybit-com
    match: {type: domain_suffix, value: bybit.com}
    ownership: first_party
    purpose: service_core
    provenance: {kind: hcloudlab_observation, source: clash_verge_final_acceptance, reference: "www.bybit.com and ws2.bybit.com routed through the crypto policy", observed_at: "2026-09-16"}
    evidence: {level: corroborated, methods: [official_domain, official_documentation, connection_log, session_observation]}
    validation: {state: partial, last_tested: "2026-09-16", tests: [web_access]}
    conflicts: []
    notes: Runtime routing identification is accepted for RC publication. This does not claim authentication or account-risk behavior is validated.
