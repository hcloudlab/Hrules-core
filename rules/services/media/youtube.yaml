schema_version: 1
module:
  id: youtube
  name: YouTube
  category: media
  policy_class: ordinary_proxy
  status: validating
  owners: [HCloudLab]
  description: Initial YouTube routing module. Start narrow with the observed first-party service domain; supporting media/CDN domains remain separate validation work.
release_policy:
  minimum_evidence: verified
  allowed_ownership: [first_party, dedicated_third_party]
  required_tests: [web_access, playback]
  forbid_unresolved_policy_conflicts: true
rules:
  - id: youtube.domain-suffix.youtube-com
    match: {type: domain_suffix, value: youtube.com}
    ownership: first_party
    purpose: service_core
    provenance: {kind: hcloudlab_observation, source: clash_verge_live_test, reference: "www.youtube.com:443 observed falling through MATCH in Hrules Test 2", observed_at: "2026-09-16"}
    evidence: {level: corroborated, methods: [official_domain, connection_log]}
    validation: {state: partial, last_tested: "2026-09-16", tests: [web_access]}
    conflicts: []
    notes: Main site routing observed. Playback dependencies such as googlevideo/ytimg require separate validation before release.
