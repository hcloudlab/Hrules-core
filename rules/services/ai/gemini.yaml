    evidence: {level: verified, methods: [official_domain, connection_log]}
    validation: {state: passed, last_tested: "2026-09-16", tests: [web_access]}
    conflicts: []
    notes: Gemini web routing verified. accounts.google.com and other shared Google dependencies remain outside this module pending auth-flow analysis.
