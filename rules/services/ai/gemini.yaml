  description: Research module for Gemini; shared Google authentication and platform dependencies require separate overlap/dependency analysis.
release_policy:
  minimum_evidence: verified
  allowed_ownership: [first_party, dedicated_third_party]
  required_tests: [web_access, auth_flow]
  forbid_unresolved_policy_conflicts: true
rules:
  - id: gemini.domain-suffix.gemini-google-com
    match: {type: domain_suffix, value: gemini.google.com}
