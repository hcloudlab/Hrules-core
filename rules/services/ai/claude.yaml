schema_version: 1
module:
  id: claude
  name: Claude
  category: ai
  policy_class: sensitive_account
  status: research
  owners:
    - HCloudLab
  description: Research module for Claude first-party service domains.

release_policy:
  minimum_evidence: verified
  allowed_ownership:
    - first_party
    - dedicated_third_party
  required_tests:
    - web_access
    - auth_flow
  forbid_unresolved_policy_conflicts: true

rules:
  - id: claude.domain-suffix.claude-ai
    match:
      type: domain_suffix
      value: claude.ai
    ownership: first_party
    purpose: service_core
    provenance:
      kind: hcloudlab_observation
      source: clash_verge_live_test
      reference: "Live Clash Verge/Mihomo test matched DomainSuffix(claude.ai) and routed through Claude/OpenAI -> US system group using a real Jiuyun subscription"
      observed_at: "2026-09-16"
    evidence:
      level: verified
      methods:
        - official_domain
        - runtime_observation
    validation:
      state: passed
      last_tested: "2026-09-16"
      tests:
        - web_access
    conflicts: []
    notes: Claude web routing verified. Authentication flow remains a separate release-gate test.
