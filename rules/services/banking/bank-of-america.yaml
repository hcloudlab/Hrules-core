    validation: {state: partial, last_tested: "2026-09-16", tests: [web_access]}
    conflicts: []
    notes: First-party namespace observed during a real Bank of America session. Authentication flow has not yet been validated through the dedicated Hrules banking policy, so this record is not release-ready.

