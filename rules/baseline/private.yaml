schema_version: 1
module:
  id: private
  name: Private and Local Network
  category: baseline
  policy_class: direct_preferred
  status: validating
  owners: [HCloudLab]
  description: Standards-defined private, loopback, link-local, CGNAT and local-use ranges that should bypass the proxy in ordinary client routing.
release_policy:
  minimum_evidence: corroborated
  allowed_ownership: [standards_defined]
  required_tests: [routing_match]
  forbid_unresolved_policy_conflicts: true
