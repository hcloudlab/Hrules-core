schema_version: 1
module:
  id: cn
  name: China Direct Baseline
  category: baseline
  policy_class: direct_preferred
  status: research
  owners: [HCloudLab]
  description: Narrow CN direct baseline. The .cn namespace is only a bootstrap rule; broad mainland service and IP coverage must come through reviewed upstream data rather than hand-maintained guesses.
release_policy:
  minimum_evidence: verified
  allowed_ownership: [standards_defined, unknown]
  required_tests: [routing_match]
  forbid_unresolved_policy_conflicts: true
rules:
  - id: cn.domain-suffix.cn
    match: {type: domain_suffix, value: cn}
    ownership: standards_defined
    purpose: service_core
    provenance: {kind: manual_research, source: standards_baseline, reference: "CN country-code top-level domain; live Clash Verge test also observed api.smoot.apple.cn matching DIRECT", observed_at: "2026-09-16"}
    evidence: {level: corroborated, methods: [manual_review, connection_log]}
    validation: {state: partial, last_tested: "2026-09-16", tests: [routing_match]}
    conflicts: []
    notes: Live routing confirms the matcher works, but this rule is not a substitute for GeoSite CN or CN IP data.

validation_observations:
  - id: cn-gap.bytedance-douyin
    observed_at: "2026-09-16"
    source: clash_verge_live_test
    result: gap
    examples: [live.douyin.com, douyinpic.com, zjcdn.com, bytegecko.com, byteeffects.com, huoshanstatic.com, bytetcc.com]
    notes: Mainland-service traffic using non-.cn namespaces fell through MATCH to the default proxy. This is evidence that .cn alone is insufficient, not authorization to add every observed shared CDN domain to CN Direct.
  - id: cn-gap.cmbchina
    observed_at: "2026-09-16"
    source: clash_verge_live_test
    result: gap
    examples: [lf12-32-gateway.paas.cmbchina.com]
    notes: Observed falling through MATCH. Treat as discovery evidence only; banking/service ownership and dependency classification require separate validation before canonical routing inclusion.
