name: Validate Hrules Core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Validate canonical modules
        run: python scripts/validate_canonical.py rules
      - name: Validate policy mappings
        run: python scripts/validate_policy.py
      - name: Validate scenario profiles
        run: python scripts/validate_profiles.py
      - name: Detect cross-module conflicts
        run: python scripts/detect_conflicts.py rules
      - name: Run semantic proof tests
        run: python tests/test_canonical_validator.py
      - name: Run conflict regression tests
        run: python tests/test_conflicts.py
      - name: Run upstream anomaly guard tests
        run: python tests/test_upstream_guard.py
      - name: Run strict ABP normalizer tests
        run: python tests/test_abp_normalizer.py
      - name: Run strict hosts normalizer tests
        run: python tests/test_hosts_normalizer.py
      - name: Validate source registry
        run: python scripts/validate_sources.py
      - name: Validate Blocking allowlist
        run: python scripts/validate_blocking_allowlist.py
      - name: Run Blocking ingestion pipeline tests
        run: python tests/test_blocking_ingestion.py
      - name: Run Blocking review gate tests
        run: python tests/test_blocking_review_gate.py
      - name: Run Blocking promotion contract tests
        run: python tests/test_blocking_promotion.py
      - name: Run Blocking classification gate tests
        run: python tests/test_blocking_classification_gate.py
      - name: Run Blocking risk triage tests
        run: python tests/test_blocking_risk.py
      - name: Run bounded Blocking review batch tests
        run: python tests/test_blocking_review_batch.py
      - name: Run Blocking review packet tests
        run: python tests/test_blocking_review_packet.py
      - name: Run real Blocking upstream dry-run
        run: python scripts/run_blocking_dry_run.py
      - name: Check canonical Blocking upstream stability
        run: python scripts/check_blocking_maintenance.py --candidates build/blocking-dry-run/candidates.json --summary build/blocking-dry-run/summary.json --out build/blocking-dry-run/maintenance.json
      - name: Run Blocking maintenance regression tests
        run: python tests/test_blocking_maintenance.py
      - name: Gate first reviewed Blocking batch
        run: |
          python scripts/gate_blocking_reviews.py             --candidates build/blocking-dry-run/candidates.json             --reviews reviews/blocking/v0.1             --out build/blocking-dry-run/review-gated.json
          python scripts/gate_blocking_classification.py             --gated build/blocking-dry-run/review-gated.json             --classifications classifications/blocking/v0.1             --out build/blocking-dry-run/classification-gated.json
          python scripts/promote_blocking_candidates.py             --gated build/blocking-dry-run/classification-gated.json             --out build/blocking-dry-run/first-canonical-proposal.yaml
          python scripts/validate_canonical.py build/blocking-dry-run/first-canonical-proposal.yaml
      - name: Validate first reviewed Blocking routing
        run: python tests/test_blocking_first_reviewed_batch.py
      - name: Mark reviewed proposal routing validation
        run: |
          python scripts/promote_blocking_candidates.py             --gated build/blocking-dry-run/classification-gated.json             --routing-match-validated             --out build/blocking-dry-run/first-canonical-proposal-validated.yaml
          python scripts/validate_canonical.py build/blocking-dry-run/first-canonical-proposal-validated.yaml
      - name: Upload Blocking review evidence
        uses: actions/upload-artifact@v4
        with:
          name: blocking-v0.1-review-evidence
          path: build/blocking-dry-run
          if-no-files-found: error
          retention-days: 14
      - name: Assert dry-run remains non-canonical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('build/blocking-dry-run/candidates.json').read_text())
          assert doc['status']=='review_only'
          assert Path('build/blocking-dry-run/summary.json').is_file()
          print(Path('build/blocking-dry-run/summary.json').read_text())
          PY
      - name: Run compiler contract tests
        run: python tests/test_compiler.py
      - name: Run profile contract tests
        run: python tests/test_profiles.py
      - name: Run MetaCubeX adapter tests
        run: python tests/test_metacubex_adapter.py
      - name: Exercise fail-closed public publisher
        run: |
          python generators/publish_public.py --out build/public-release
          test -f build/public-release/manifest.json
          test -f build/public-release/SHA256SUMS
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('build/public-release/manifest.json').read_text())
          assert doc['version'] == 'v0.1.0-rc1'
          assert doc['channel'] == 'rc'
          artifacts = doc['artifacts']
          skipped = set(doc['skipped_non_publishable_modules'])
          assert artifacts, 'release staging unexpectedly empty'
          emitted_modules = {item['module'] for item in artifacts}
          assert not (emitted_modules & skipped), (emitted_modules & skipped)
          assert 'blocking' in skipped, 'research Blocking module must remain withheld from RC public output'
          assert 'blocking' not in emitted_modules
          for item in artifacts:
              path = Path('build/public-release') / item['path']
              assert path.is_file(), path
              assert item['sha256'] and len(item['sha256']) == 64
          print('EMITTED:', ', '.join(sorted(emitted_modules)))
          print('WITHHELD:', ', '.join(sorted(skipped)))
          print(f"PASS public publisher: {len(artifacts)} publishable artifacts; {len(skipped)} modules withheld")
          PY
      - name: Upload validated RC staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrules-public-v0.1.0-rc1
          path: build/public-release
          if-no-files-found: error
          retention-days: 7
      - name: Build pinned Mihomo provider artifacts
        run: python generators/build_mihomo_providers.py --only youtube,cn
      - name: Test Mihomo provider-mode proof config
        run: python tests/test_mihomo_provider_proof.py
      - name: Test provider-mode transformation of an existing Mihomo config
        run: python tests/test_mihomo_real_provider_builder.py
      - name: Run Mihomo topology tests
        run: python tests/test_mihomo_builder.py
      - name: Assert generated Mihomo routing behavior
        run: python tests/test_generated_mihomo.py
      - name: Test transformation of an existing Mihomo config
        run: python tests/test_mihomo_real_config_builder.py
      - name: Build transformed Mihomo fixture
        run: python generators/build_mihomo_from_config.py tests/fixtures/mihomo-source-config.yaml --include-research --out build/proof/hrules-mihomo-real-fixture.yaml
      - name: Assert Mihomo v0.1 user transformation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          src=yaml.safe_load(Path('tests/fixtures/mihomo-source-config.yaml').read_text())
          out=yaml.safe_load(Path('build/proof/hrules-mihomo-real-fixture.yaml').read_text())
          assert out['proxies']==src['proxies']
          assert out['dns']==src['dns']
          assert out['external-ui']==src['external-ui']
          assert out['keep-alive-interval']==src['keep-alive-interval']
          assert out['mode']=='rule'
          assert out['proxy-groups'] != src['proxy-groups']
          assert out['rules'] != src['rules']
          assert out['rules'][-1]=='MATCH,🚀 默认代理 [自选]'
          assert any(x=='DOMAIN,app.adjust.com,REJECT' for x in out['rules'])
          assert any(x=='DOMAIN,c.webengage.com,REJECT' for x in out['rules'])
          print('PASS Mihomo v0.1 transformation contract')
          PY
      - name: Upload Mihomo v0.1 transformed acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-v0.1-transformed-acceptance
          path: build/proof/hrules-mihomo-real-fixture.yaml
          if-no-files-found: error
          retention-days: 14
      - name: Download latest Mihomo linux amd64
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/MetaCubeX/mihomo/releases/latest'
          url="$(curl -fsSL "$api" | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v[0-9].*\\.gz$")) | .browser_download_url' | head -n1)"
          test -n "$url" -a "$url" != null
          curl -fsSL "$url" -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          /tmp/mihomo -v
      - name: Validate generated proof config with Mihomo
        run: |
          python generators/build_mihomo.py --include-research
          /tmp/mihomo -t -f build/proof/hrules-mihomo-v0.1.yaml
      - name: Validate provider-mode proof config with Mihomo
        run: /tmp/mihomo -t -f build/provider-proof/hrules-mihomo-provider-v0.1.yaml
      - name: Validate provider-mode transformed config with Mihomo
        run: /tmp/mihomo -t -f build/proof/hrules-mihomo-real-provider-fixture.yaml
      - name: Validate transformed existing config with Mihomo
        run: /tmp/mihomo -t -f build/proof/hrules-mihomo-real-fixture.yaml
