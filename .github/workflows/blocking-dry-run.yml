name: Blocking Upstream Dry Run

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run guarded upstream ingestion
        run: python scripts/run_blocking_dry_run.py
      - name: Show summary
        run: cat build/blocking-dry-run/summary.json
      - name: Upload review-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: blocking-upstream-dry-run
          path: build/blocking-dry-run
          if-no-files-found: error
          retention-days: 7
