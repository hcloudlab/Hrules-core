schema_version: 1
release:
  version: v0.1.0-rc1
  status: release_candidate
  created_at: "2026-09-16"
  source_repository: hcloudlab/Hrules-core
  public_repository: hcloudlab/Hrules
  acceptance_record: docs/validation/final-acceptance-2026-09-16.md

scope:
  clients:
    - mihomo
  profiles:
    - basic
    - ai
    - us-finance
    - crypto
    - finance-pro
  withheld_profiles:
    - full
  routing_classes:
    - sensitive_ai
    - general_ai
    - youtube_media
    - crypto_account
    - us_banking_account
    - brokerage_account
    - private_direct
    - cn_direct
    - default_proxy

validated_runtime_examples:
  sensitive_ai:
    - chatgpt.com
  crypto_account:
    - coinbase.com
    - bybit.com
    - kraken.com
    - binance.us
  us_banking_account:
    - bankofamerica.com
    - americanexpress.com
    - capitalone.com
    - connect.secure.wf.com
  brokerage_account:
    - interactivebrokers.com
    - ibkr.com
  youtube_media:
    - youtube.com
  cn_direct:
    - representative CN service traffic via hrules-cn

acceptance_corrections:
  - domain: binance.us
    policy: crypto_account
    evidence: runtime_miss_then_offline_regression
  - domain: ibkr.com
    policy: brokerage_account
    evidence: runtime_miss_then_offline_regression

release_gates:
  canonical_schema: required
  policy_mapping: required
  profile_validation: required
  conflict_detection: required
  semantic_tests: required
  compiler_contract_tests: required
  profile_contract_tests: required
  provider_tests: required
  topology_tests: required
  generated_routing_assertions: required
  mihomo_syntax_validation: required
  runtime_acceptance_record: required

publication_policy:
  upstream_changes_publish_directly: false
  publish_only_after_green_ci: true
  publish_policy_free_rule_providers: true
  publish_only_complete_profiles: true
  include_versioned_artifacts: true
  include_sha256: true
  preserve_attribution_and_license_metadata: true

notes:
  - RC artifacts validate routing identification only; they do not guarantee authentication, account eligibility, fraud-control, or service-side risk outcomes.
  - Sensitive routing controls egress selection; it does not claim to prevent account risk or bans.
  - Shared third-party domains are not assigned to sensitive service modules solely because they appear during a session.
  - The Full profile is intentionally withheld while citi, okx, telegram and tradingview remain below the RC publication gate.
  - Shadowrocket, sing-box/SFM, v2rayN and Karing are architectural targets but are not part of this Mihomo RC acceptance gate.
