schema_version: 1
policy_version: v0.1
status: design_baseline

# Routing order is semantic and MUST NOT depend on filesystem/path order.
routing_stages:
  private: 10
  blocking: 20
  sensitive_service: 30
  ordinary_service: 40
  cn_domain: 50
  cn_ip: 60
  fallback: 90

# Canonical modules identify traffic. This file maps those modules to logical
# routing policies. Client templates decide how each logical policy is rendered.

logical_policies:
  blocking_reject:
    routing_stage: blocking
    display_name: REJECT
    behavior: reject
    user_visible: false
    notes:
      - Blocking is opt-in at profile/template level until false-positive acceptance is complete.

  sensitive_ai:
    routing_stage: sensitive_service
    display_name: "🔐 Claude / OpenAI [场景]"
    behavior: sensitive_account
    user_visible: true
    egress_requirements:
      prioritize_consistency: true
      require_static_ip: false
      require_residential_or_isp: false
      force_country: null
      allow_region_internal_auto_selection: true
    notes:
      - Stable airport nodes are valid choices.
      - Avoid uncontrolled egress changes; do not claim this policy prevents account risk.

  general_ai:
    routing_stage: ordinary_service
    display_name: "🤖 AI 服务 [场景]"
    behavior: region_preferred
    user_visible: true
    egress_requirements:
      prioritize_consistency: false
      require_static_ip: false
      require_residential_or_isp: false
      force_country: null
      allow_region_internal_auto_selection: true

  youtube_media:
    routing_stage: ordinary_service
    display_name: "📺 YouTube [场景]"
    behavior: ordinary_proxy
    user_visible: true
    egress_requirements:
      prioritize_consistency: false
      require_static_ip: false
      require_residential_or_isp: false
      force_country: null
      allow_region_internal_auto_selection: true

  telegram_communication:
    routing_stage: ordinary_service
    display_name: "💬 Telegram [场景]"
    behavior: ordinary_proxy
    user_visible: true
    egress_requirements:
      prioritize_consistency: false
      require_static_ip: false
      require_residential_or_isp: false
      force_country: null
      allow_region_internal_auto_selection: true

  crypto_account:
    routing_stage: sensitive_service
    display_name: "💰 虚拟货币 [场景]"
    behavior: sensitive_account
    user_visible: true
    egress_requirements:
      prioritize_consistency: true
      require_static_ip: false
      require_residential_or_isp: false
      force_country: null
      allow_region_internal_auto_selection: true

  us_banking_account:
    routing_stage: sensitive_service
    display_name: "🏦 美国银行 [场景]"
    behavior: sensitive_account
    user_visible: true
    egress_requirements:
      prioritize_consistency: true
      require_static_ip: false
      require_residential_or_isp: false
      force_country: null
      allow_region_internal_auto_selection: true

  brokerage_account:
    routing_stage: sensitive_service
    display_name: "📈 美股 [场景]"
    behavior: sensitive_account
    user_visible: true
    egress_requirements:
      prioritize_consistency: true
      require_static_ip: false
      require_residential_or_isp: false
      force_country: null
      allow_region_internal_auto_selection: true

  stock_market_data:
    routing_stage: ordinary_service
    display_name: "📈 美股 [场景]"
    behavior: informational
    user_visible: false
    inherit_user_choice_from: brokerage_account
    notes:
      - Canonical identity remains separate from brokerage/account traffic.
      - v0.1 may reuse the same visible user choice without pretending both traffic classes have the same semantics.

  private_direct:
    routing_stage: private
    display_name: DIRECT
    behavior: direct_preferred
    user_visible: false

  cn_direct:
    routing_stage: cn_domain
    display_name: DIRECT
    behavior: direct_preferred
    user_visible: false
    notes:
      - v0.1 canonical baseline currently covers only the .cn namespace.
      - Broader CN domains/IPs require a reviewed upstream adapter before release.

module_bindings:
  blocking: blocking_reject
  claude: sensitive_ai
  openai: sensitive_ai
  gemini: general_ai
  youtube: youtube_media
  telegram: telegram_communication
  coinbase: crypto_account
  binance: crypto_account
  okx: crypto_account
  bybit: crypto_account
  kraken: crypto_account
  bank-of-america: us_banking_account
  chase: us_banking_account
  wells-fargo: us_banking_account
  citi: us_banking_account
  capital-one: us_banking_account
  american-express: us_banking_account
  interactive-brokers: brokerage_account
  tradingview: stock_market_data
  private: private_direct
  cn: cn_direct
