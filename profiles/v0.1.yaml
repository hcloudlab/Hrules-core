schema_version: 1
version: v0.1

# Profiles are user-facing scenarios only. Canonical service rules remain single-source.
# v0.1 profile membership is intentionally limited to modules with recorded routing
# acceptance or an equivalent release-candidate gate. Additional services remain in
# the canonical Full superset until they are ready for scenario publication.
profiles:
  basic:
    title: Basic
    description: 日常浏览与 YouTube
    include:
      - private
      - cn
      - youtube

  ai:
    title: AI
    description: Basic + Claude / ChatGPT / Gemini
    extends: [basic]
    include:
      - claude
      - openai
      - gemini

  us-finance:
    title: US Finance
    description: AI + 已验证的美国银行 / 券商场景
    extends: [ai]
    include:
      - bank-of-america
      - chase
      - wells-fargo
      - capital-one
      - american-express
      - interactive-brokers

  crypto:
    title: Crypto
    description: AI + 已验证的主流虚拟货币交易平台
    extends: [ai]
    include:
      - binance
      - coinbase
      - bybit
      - kraken

  finance-pro:
    title: Finance Pro
    description: AI + 美国金融 + Crypto
    extends: [us-finance, crypto]
    include: []

  full:
    title: Full
    description: Hrules 全场景规则集合，用于高级用户和自定义；只有通过对应发布门槛的模块才会进入公开构建
    include_all: true

clients:
  # Availability is independent from profile definitions.
  # A client becomes public only after its generated result passes real-client acceptance.
  mihomo:
    public_names: [Clash Verge, Clash Mi]
    status: validating
  shadowrocket:
    public_names: [Shadowrocket]
    status: planned
  sing-box:
    public_names: [SFM, sing-box]
    status: planned
  v2rayn:
    public_names: [v2rayN]
    status: planned
  karing:
    public_names: [Karing]
    status: planned
