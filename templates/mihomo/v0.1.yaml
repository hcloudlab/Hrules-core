schema_version: 1
template_version: v0.1
client: mihomo
status: prototype

# This is a topology contract, not yet a complete importable Clash Verge config.
# Generators will merge validated rule artifacts and subscription/provider nodes.

region_groups:
  - id: us
    name: "🇺🇸 美国 [系统]"
    type: url-test
    include_all: true
    filter: "(?i)(美国|US|United States|Los Angeles|San Jose|Seattle|Dallas|New York)"
    test_url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - id: jp
    name: "🇯🇵 日本 [系统]"
    type: url-test
    include_all: true
    filter: "(?i)(日本|JP|Japan|Tokyo|Osaka)"
    test_url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - id: sg
    name: "🇸🇬 新加坡 [系统]"
    type: url-test
    include_all: true
    filter: "(?i)(新加坡|SG|Singapore)"
    test_url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - id: hk
    name: "🇭🇰 香港 [系统]"
    type: url-test
    include_all: true
    filter: "(?i)(香港|HK|Hong Kong)"
    test_url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - id: tw
    name: "🇹🇼 台湾 [系统]"
    type: url-test
    include_all: true
    filter: "(?i)(台湾|台灣|TW|Taiwan)"
    test_url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

system_groups:
  - id: all
    name: "🌐 全部节点 [系统]"
    type: select
    include_all: true
  - id: auto
    name: "♻️ 自动选择 [系统]"
    type: url-test
    include_all: true
    test_url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

user_groups:
  - policy: sensitive_ai
    name: "🔐 Claude / OpenAI [自选]"
    type: select
    candidates:
      - "🇺🇸 美国 [系统]"
      - "🇯🇵 日本 [系统]"
      - "🇸🇬 新加坡 [系统]"
      - "🇭🇰 香港 [系统]"
      - "🇹🇼 台湾 [系统]"
      - "🌐 全部节点 [系统]"
    optional_slots:
      - "🎯 固定节点 [自选]"
      - "🏠 ISP / 住宅 [自选]"

  - policy: general_ai
    name: "🤖 AI 服务 [自选]"
    type: select
    candidates:
      - "♻️ 自动选择 [系统]"
      - "🇺🇸 美国 [系统]"
      - "🇯🇵 日本 [系统]"
      - "🇸🇬 新加坡 [系统]"
      - "🌐 全部节点 [系统]"

  - policy: youtube_media
    name: "📺 YouTube [自选]"
    type: select
    candidates:
      - "♻️ 自动选择 [系统]"
      - "🇺🇸 美国 [系统]"
      - "🇯🇵 日本 [系统]"
      - "🇸🇬 新加坡 [系统]"
      - "🇭🇰 香港 [系统]"
      - "🇹🇼 台湾 [系统]"
      - "🌐 全部节点 [系统]"

  - policy: telegram_communication
    name: "💬 Telegram [自选]"
    type: select
    candidates:
      - "♻️ 自动选择 [系统]"
      - "🇺🇸 美国 [系统]"
      - "🇯🇵 日本 [系统]"
      - "🇸🇬 新加坡 [系统]"
      - "🇭🇰 香港 [系统]"
      - "🇹🇼 台湾 [系统]"
      - "🌐 全部节点 [系统]"

  - policy: crypto_account
    name: "💰 虚拟货币 [自选]"
    type: select
    candidates:
      - "🇺🇸 美国 [系统]"
      - "🇯🇵 日本 [系统]"
      - "🇸🇬 新加坡 [系统]"
      - "🌐 全部节点 [系统]"
    optional_slots: ["🎯 固定节点 [自选]", "🏠 ISP / 住宅 [自选]"]

  - policy: us_banking_account
    name: "🏦 美国银行 [自选]"
    type: select
    candidates:
      - "🇺🇸 美国 [系统]"
      - "🌐 全部节点 [系统]"
    optional_slots: ["🎯 固定节点 [自选]", "🏠 ISP / 住宅 [自选]"]

  - policy: brokerage_account
    name: "📈 美股 [自选]"
    type: select
    candidates:
      - "🇺🇸 美国 [系统]"
      - "🌐 全部节点 [系统]"
    optional_slots: ["🎯 固定节点 [自选]", "🏠 ISP / 住宅 [自选]"]

fallback:
  name: "🚀 默认代理 [自选]"
  type: select
  candidates:
    - "♻️ 自动选择 [系统]"
    - "🌐 全部节点 [系统]"

safety_contract:
  optional_slots_must_not_be_referenced_when_empty: true
  missing_region_must_not_break_config: true
  sensitive_groups_must_not_default_to_cross_region_global_auto: true
  canonical_policy_names_must_match_policy_mapping: true
